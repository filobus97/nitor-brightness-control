name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release tagged v<Cargo.toml version> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/Nitor.exe dist/Nitor-x64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/Nitor.exe dist/Nitor-arm64.exe
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nitor
          path: dist/*.exe
          if-no-files-found: error

  release:
    # Every push to main publishes v<Cargo.toml version> if that release doesn't exist yet
    # (so releasing = bumping the version). Also: a pushed v* tag, or "Run workflow"
    # with "release" ticked on main.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release tag from Cargo.toml version
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME != Cargo.toml $tag"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Skip if already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SKIP != '1'
        with:
          name: nitor
          path: dist

      - name: Publish release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # Creates the tag on this commit when it doesn't exist yet (manual run).
          gh release create "$TAG" *.exe SHA256SUMS.txt --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Nitor $TAG" --generate-notes $prerelease \
            --notes "**Download:** \`Nitor-x64.exe\` for most PCs (Intel/AMD) · \`Nitor-arm64.exe\` for ARM PCs (Snapdragon). Not sure? Settings → System → About → System type."
