name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release tagged v<Cargo.toml version> from this commit"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build x64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/Nitor.exe dist/Nitor-x64.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/Nitor.exe dist/Nitor-arm64.exe
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: nitor
          path: dist/*.exe
          if-no-files-found: error

  release:
    # A pushed v* tag, or "Run workflow" with "release" ticked (on main).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release tag from Cargo.toml version
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME != Cargo.toml $tag"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: nitor
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # Creates the tag on this commit when it doesn't exist yet (manual run).
          gh release create "$TAG" *.exe SHA256SUMS.txt --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Nitor $TAG" --generate-notes $prerelease
