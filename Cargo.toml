[package]
name = "nitor"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Portable per-monitor DDC/CI brightness tray for Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/filobus97/nitor-brightness-controll"
publish = false

[[bin]]
name = "Nitor"
path = "src/main.rs"

[features]
# Nitor Plus edition: the automation features (src/auto, src/win/auto). Off by default.
plus = []

[target.'cfg(windows)'.dependencies]
# Vector2 for Direct2D calls; same version the `windows` crate uses.
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Devices_Geolocation",
    "Devices_Sensors",
    "Foundation",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
